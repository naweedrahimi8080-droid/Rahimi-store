<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Rahimi Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#18212f}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:row-reverse}.sidebar{width:260px;background:#111827;color:#fff;padding:20px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:8px 4px 25px}.brand span,.logo{width:44px;height:44px;border-radius:12px;background:#fff;color:#111827;display:grid;place-items:center;font-size:22px;font-weight:800}.brand b{display:block;font-size:17px}.brand small{color:#9ca3af}.sidebar nav{display:grid;gap:7px}.sidebar nav button,.userbox button{border:0;background:transparent;color:#d1d5db;padding:12px;border-radius:10px;text-align:right;display:flex;align-items:center;gap:10px}.sidebar nav button.active,.sidebar nav button:hover{background:#263244;color:#fff}.userbox{margin-top:auto;border-top:1px solid #374151;padding-top:15px}.userbox b,.userbox small{display:block}.userbox small{color:#9ca3af;margin:4px 0 10px}.userbox button{padding:8px 0;color:#fca5a5}.main{flex:1;padding:28px;max-width:1400px;margin:auto;width:100%}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0 0 5px;font-size:28px}h3{margin-top:0}.muted{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}.stat span{color:#6b7280}.stat strong{display:block;font-size:25px;margin-top:12px}.primary{background:#111827;color:#fff;border:0;border-radius:10px;padding:11px 16px}.primary:disabled{opacity:.5;cursor:not-allowed}.ghost{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 14px}.toolbar{display:flex;justify-content:flex-start;margin-bottom:15px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}.formgrid label,.login label,.cart label{display:grid;gap:6px;font-weight:700}.formgrid input,.login input,.cart input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;outline:none}.formgrid input:focus,.login input:focus,.cart input:focus{border-color:#111827}.actions{grid-column:1/-1;display:flex;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right}th{background:#f9fafb}.low{color:#dc2626;font-weight:700}.iconbtn{border:0;background:transparent;color:#dc2626}.empty{text-align:center;color:#9ca3af;padding:30px}.salegrid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.productgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-align:right;display:grid;gap:5px}.product:hover{border-color:#111827}.product span,.product small{color:#6b7280}.product strong{font-size:18px}.cart{position:sticky;top:15px;height:max-content}.cartrow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.cartrow small{display:block;color:#6b7280;margin-top:4px}.total{display:flex;justify-content:space-between;border-top:2px solid #eee;margin-top:12px;padding-top:14px;font-size:19px}.full{width:100%;margin-top:15px}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);text-align:right}.login .logo{margin:0 auto 12px}.login h1,.login h2{text-align:center}.login label{margin-top:13px}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-top:12px}.login .primary{width:100%;margin-top:15px}.setup{max-width:650px}.loader{width:34px;height:34px;border:4px solid #ddd;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 12px}@keyframes spin{to{transform:rotate(360deg)}}code{background:#f3f4f6;padding:2px 5px;border-radius:5px}
@media(max-width:900px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.salegrid{grid-template-columns:1fr}.productgrid{grid-template-columns:repeat(2,1fr)}.cart{position:static}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;min-height:auto;padding:12px}.brand{padding-bottom:10px}.sidebar nav{display:grid;grid-template-columns:repeat(4,1fr)}.sidebar nav button{justify-content:center;font-size:12px;padding:9px}.sidebar nav button span{display:none}.userbox{display:none}.main{padding:15px}header{align-items:flex-start}.stats{gap:10px}.stat{padding:14px}.formgrid{grid-template-columns:1fr}.productgrid{grid-template-columns:1fr}.salegrid{gap:10px}h1{font-size:23px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://xdpwoflwfzdyfuhccldh.supabase.co';
const SUPABASE_KEY='sb_publishable_-pKlKQqg6Kr_aK-XNOJE7w_JwTmZjNp';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById('root');
const money=n=>new Intl.NumberFormat('ps-AF',{maximumFractionDigits:0}).format(Number(n)||0)+' ؋';
let session=null, profile=null, tab='dashboard';

function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function loading(){root.innerHTML='<div class="center"><div><div class="loader"></div><div class="muted">در حال بارگذاری…</div></div></div>';}
function appShell(content){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span>R</span><div><b>Rahimi Store</b><small>سیستم مدیریت فروشگاه</small></div></div><nav>
<button class="${tab==='dashboard'?'active':''}" data-tab="dashboard">📊 <span>داشبورد</span></button>
<button class="${tab==='products'?'active':''}" data-tab="products">📦 <span>محصولات</span></button>
<button class="${tab==='sales'?'active':''}" data-tab="sales">🛒 <span>فروش جدید</span></button>
<button class="${tab==='orders'?'active':''}" data-tab="orders">📋 <span>سفارش‌ها</span></button>
</nav><div class="userbox"><b>${escapeHtml(profile?.full_name||session?.user?.email||'')}</b><small>${profile?.role==='admin'?'مدیر':'مدیر فروش'}</small><button id="logout">↪ خروج</button></div></aside><main class="main">${content}</main></div>`;
root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTab()});root.querySelector('#logout')?.addEventListener('click',async()=>{await supabase.auth.signOut()});}
function header(title){return `<header><div><h1>${title}</h1><p class="muted">Rahimi Store — مدیریت آنلاین</p></div><button class="ghost" id="refresh">↻ تازه‌سازی</button></header>`}

async function dashboard(){const [{data:p},{data:o}]=await Promise.all([supabase.from('products').select('stock'),supabase.from('orders').select('total')]);const products=p?.length||0,stock=p?.reduce((a,x)=>a+(Number(x.stock)||0),0)||0,orders=o?.length||0,revenue=o?.reduce((a,x)=>a+(Number(x.total)||0),0)||0;return header('داشبورد')+`<div class="stats"><div class="stat card"><span>تعداد محصولات</span><strong>${products}</strong></div><div class="stat card"><span>موجودی انبار</span><strong>${stock}</strong></div><div class="stat card"><span>سفارش‌ها</span><strong>${orders}</strong></div><div class="stat card"><span>فروش ثبت‌شده</span><strong>${money(revenue)}</strong></div></div><div class="card"><h3>وضعیت سیستم</h3><p class="muted">داده‌ها از دیتابیس آنلاین Supabase خوانده می‌شوند.</p></div>`}

async function products(){const {data,error}=await supabase.from('products').select('*').order('created_at',{ascending:false});if(error)return header('محصولات')+`<div class="card error">${escapeHtml(error.message)}</div>`;let rows=(data||[]).map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.sku)}</td><td>${escapeHtml(p.category||'—')}</td><td>${money(p.price)}</td><td class="${p.stock<=p.min_stock?'low':''}">${p.stock}</td><td><button class="iconbtn" data-del="${p.id}">🗑</button></td></tr>`).join('');return header('محصولات')+`<div class="toolbar"><button class="primary" id="newProduct">＋ محصول جدید</button></div><div id="productForm"></div><div class="card tablewrap"><table><thead><tr><th>محصول</th><th>SKU</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">هنوز محصولی ثبت نشده است.</td></tr>'}</tbody></table></div>`}
function productForm(){return `<form class="card formgrid" id="pf"><label>نام محصول<input name="name" required></label><label>کد کالا / SKU<input name="sku" required></label><label>دسته‌بندی<input name="category"></label><label>قیمت فروش<input name="price" type="number" min="0" required></label><label>قیمت خرید<input name="cost" type="number" min="0"></label><label>موجودی اولیه<input name="stock" type="number" min="0" value="0"></label><label>حداقل موجودی<input name="min_stock" type="number" min="0" value="5"></label><div class="actions"><button class="primary">ذخیره محصول</button><button type="button" class="ghost" id="cancelPF">انصراف</button></div></form>`}

async function sales(){const {data}=await supabase.from('products').select('*').eq('active',true).gt('stock',0).order('name');const ps=data||[];return header('فروش جدید')+`<div class="salegrid"><div class="card"><h3>انتخاب کالا</h3><div class="productgrid">${ps.map(p=>`<button class="product" data-add="${p.id}"><b>${escapeHtml(p.name)}</b><span>${escapeHtml(p.sku)}</span><strong>${money(p.price)}</strong><small>موجودی: ${p.stock}</small></button>`).join('')||'<div class="empty">کالای دارای موجودی پیدا نشد.</div>'}</div></div><div class="card cart"><h3>سبد فروش</h3><label>نام مشتری<input id="customerName" placeholder="اختیاری"></label><label style="margin-top:10px">شماره تماس<input id="customerPhone" placeholder="اختیاری"></label><div id="cartBody" class="muted" style="margin-top:12px">سبد خالی است.</div><div class="total"><span>مجموع</span><strong id="cartTotal">0 ؋</strong></div><button class="primary full" id="checkout" disabled>ثبت فروش</button></div></div>`}

async function orders(){const {data,error}=await supabase.from('orders').select('*').order('created_at',{ascending:false});if(error)return header('سفارش‌ها و فروش‌ها')+`<div class="card error">${escapeHtml(error.message)}</div>`;const rows=(data||[]).map(o=>`<tr><td>${escapeHtml(o.order_no)}</td><td>${escapeHtml(o.customer_name||'مشتری حضوری')}<small>${escapeHtml(o.customer_phone||'')}</small></td><td>${money(o.total)}</td><td><select data-status="${o.id}"><option value="paid" ${o.status==='paid'?'selected':''}>پرداخت شد</option><option value="pending" ${o.status==='pending'?'selected':''}>در انتظار</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغو</option></select></td><td>${new Date(o.created_at).toLocaleString('fa-AF')}</td></tr>`).join('');return header('سفارش‌ها و فروش‌ها')+`<div class="card tablewrap"><table><thead><tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">هنوز سفارشی ثبت نشده است.</td></tr>'}</tbody></table></div>`}

async function renderTab(){let c=tab==='dashboard'?await dashboard():tab==='products'?await products():tab==='sales'?await sales():await orders();appShell(c);document.getElementById('refresh')?.addEventListener('click',renderTab);bindTab();}
let cart=[];
function bindTab(){
 if(tab==='products'){document.getElementById('newProduct')?.addEventListener('click',()=>{document.getElementById('productForm').innerHTML=productForm();document.getElementById('cancelPF').onclick=()=>document.getElementById('productForm').innerHTML='';document.getElementById('pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await supabase.from('products').insert({name:f.get('name'),sku:f.get('sku'),category:f.get('category')||null,price:Number(f.get('price')),cost:Number(f.get('cost')||0),stock:Number(f.get('stock')||0),min_stock:Number(f.get('min_stock')||0)});if(error)alert(error.message);else renderTab()}});root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('این محصول حذف شود؟'))return;const {error}=await supabase.from('products').delete().eq('id',b.dataset.del);if(error)alert(error.message);else renderTab()})}
 if(tab==='sales'){root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;const name=b.querySelector('b').textContent;const price=Number(b.querySelector('strong').textContent.replace(/[^0-9]/g,''));const stock=Number(b.querySelector('small').textContent.replace(/[^0-9]/g,''));const x=cart.find(i=>i.id===id);if(x)x.qty=Math.min(x.qty+1,stock);else cart.push({id,name,price,stock,qty:1});drawCart()});drawCart()}
 if(tab==='orders'){root.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await supabase.from('orders').update({status:s.value}).eq('id',s.dataset.status);if(error)alert(error.message)})}
}
function drawCart(){if(tab!=='sales')return;const body=document.getElementById('cartBody'),total=document.getElementById('cartTotal'),btn=document.getElementById('checkout');if(!body)return;if(!cart.length){body.innerHTML='<p class="muted">سبد خالی است.</p>';total.textContent='0 ؋';btn.disabled=true;return}body.innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${escapeHtml(x.name)}</b><small>${x.qty} × ${money(x.price)}</small></div><div><strong>${money(x.qty*x.price)}</strong><button class="iconbtn" data-rem="${i}">×</button></div></div>`).join('');const t=cart.reduce((a,x)=>a+x.price*x.qty,0);total.textContent=money(t);btn.disabled=false;root.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.rem),1);drawCart()});btn.onclick=checkout;}
async function checkout(){if(!cart.length)return;const items=cart.map(x=>({product_id:x.id,quantity:x.qty,unit_price:x.price}));const {data,error}=await supabase.rpc('create_sale',{p_customer_name:document.getElementById('customerName').value||null,p_customer_phone:document.getElementById('customerPhone').value||null,p_items:items});if(error){alert(error.message);return}alert('فروش ثبت شد: '+data.order_no);cart=[];renderTab();}

function login(){root.innerHTML=`<div class="center"><form class="login card" id="login"><div class="logo">R</div><h1>ورود مدیر</h1><p class="muted" style="text-align:center">برای ورود به Rahimi Store</p><label>ایمیل<input id="email" type="email" required></label><label>رمز عبور<input id="password" type="password" required></label><div id="loginError"></div><button class="primary" id="loginBtn">ورود</button></form></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error)document.getElementById('loginError').innerHTML='<div class="error">'+escapeHtml(error.message)+'</div>';btn.disabled=false}}
function denied(){root.innerHTML=`<div class="center"><div class="card login"><h2>دسترسی مجاز نیست</h2><p class="muted">حساب شما نقش مدیر یا مدیر فروش ندارد.</p><button class="primary" id="out">خروج</button></div></div>`;document.getElementById('out').onclick=()=>supabase.auth.signOut()}
async function start(){loading();const {data}=await supabase.auth.getSession();session=data.session;if(session){const r=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=r.data;if(!profile||!['admin','manager'].includes(profile.role)){denied();return}await renderTab()}else login()}
supabase.auth.onAuthStateChange(async()=>{const {data}=await supabase.auth.getSession();session=data.session;if(session){const r=await supabase.from('profiles').select('*').eq('id',session.user.id).single();profile=r.data;if(profile&&['admin','manager'].includes(profile.role))renderTab();else denied()}else login()});
start();
</script>
</body>
</html>
